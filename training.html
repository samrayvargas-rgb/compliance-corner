<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10151c" />
  <title>Training · HubStarr</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap");
    :root { --bg:#10151c; --panel:#1c2430; --line:#2c3644; --ink:#e8edf3; --muted:#9aa6b4; --red:#e82020; --blue:#204090; --green:#3dba7a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", Arial, sans-serif; }
    header { background: linear-gradient(90deg, var(--red) 0 6px, var(--blue) 6px 12px, transparent 12px), linear-gradient(180deg,#151c28,#0f141c); padding:18px; border-bottom:1px solid var(--line); }
    .brand { display:inline-flex; background:#fff; border-radius:10px; padding:8px 12px; margin:0 0 14px; }
    .brand img { height:32px; display:block; }
    header a { color:var(--red); font-size:13px; font-weight:600; text-decoration:none; }
    h1 { margin:8px 0 0; font-family:"Barlow Condensed", sans-serif; font-weight:800; font-size:34px; text-transform:uppercase; letter-spacing:.02em; }
    .wrap { max-width:560px; margin:0 auto; padding:18px 14px 48px; }
    .card { display:grid; grid-template-columns:52px 1fr auto; gap:12px; align-items:center; text-decoration:none; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 0 10px; }
    .ico { width:52px; height:52px; border-radius:12px; display:grid; place-items:center; background:#c9842a; color:#111; font-family:"Barlow Condensed", sans-serif; font-weight:800; }
    h2 { margin:0 0 3px; font-family:"Barlow Condensed", sans-serif; font-size:22px; text-transform:uppercase; }
    p { margin:0; color:var(--muted); font-size:13px; line-height:1.4; }
    .tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 7px; border-radius:999px; background:rgba(61,186,122,.15); color:var(--green); white-space:nowrap; }
    .note { margin-top:16px; font-size:12px; color:var(--muted); line-height:1.45; }
    .note strong { color:var(--ink); }
    code { font-size:11px; color:#d5dde6; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="logo-header.png" alt="HubStarr Logistics" /></div>
    <div><a href="index.html">← Compliance Corner</a></div>
    <h1>Training</h1>
  </header>
  <div class="wrap">
    <div id="list"></div>
    <p class="note">
      <strong>On or off:</strong> in <code>training.js</code>, set <code>on: true</code> to show it and <code>on: false</code> to take it off. Then push. Old responses stay in Microsoft Forms.
    </p>
  </div>
  <script src="training.js"></script>
  <script>
    var list = document.getElementById("list");
    var items = (window.HS_TRAINING || []).filter(function (t) { return t.on; });
    if (!items.length) {
      list.innerHTML = "<p class='note'>No training on the floor right now.</p>";
    }
    items.forEach(function (t) {
      var a = document.createElement("a");
      a.className = "card";
      a.href = "training-view.html?id=" + encodeURIComponent(t.id);
      a.innerHTML =
        "<div class='ico'></div>" +
        "<div><h2></h2><p></p></div>" +
        "<span class='tag'>Open</span>";
      a.querySelector(".ico").textContent = t.code || "TRN";
      a.querySelector("h2").textContent = t.title || "Training";
      a.querySelector("p").textContent = t.blurb || "Read it, then sign off.";
      list.appendChild(a);
    });
  </script>
</body>
</html>
