<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10151c" />
  <title>SDS Library · HubStarr</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap");

:root {
  --bg: #10151c;
  --bg-2: #171e28;
  --panel: #1c2430;
  --line: #2c3644;
  --ink: #e8edf3;
  --muted: #9aa6b4;
  --hs-blue: #204090;
  --hs-red: #e82020;
  --amber: #e82020;
  --green: #3dba7a;
  --red: #e82020;
  --blue: #204090;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans", Arial, sans-serif;
}
body {
  min-height: 100dvh;
  background-image:
    linear-gradient(180deg, rgba(16,21,28,.15), var(--bg) 260px),
    repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, transparent 2px 10px);
}
header {
  background:
    linear-gradient(90deg, var(--hs-red) 0 6px, var(--hs-blue) 6px 12px, transparent 12px),
    linear-gradient(180deg, #151c28, #0f141c);
  color: var(--ink);
  padding: 18px 18px 18px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: inline-flex;
  align-items: center;
  background: #fff;
  border-radius: 10px;
  padding: 8px 12px;
  margin: 0 0 14px;
}
.brand img { display: block; height: 40px; width: auto; }
header.sub .brand img { height: 32px; }
header a { color: var(--amber); font-size: 13px; font-weight: 600; text-decoration: none; }
header .kicker {
  margin: 0 0 6px;
  font-family: "Barlow Condensed", sans-serif;
  letter-spacing: .18em;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--amber);
}
header h1 {
  margin: 0;
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 800;
  font-size: 34px;
  letter-spacing: .02em;
  line-height: 0.95;
  text-transform: uppercase;
}
header p { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 48px; }
.grid { display: grid; gap: 10px; }
.card {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  gap: 12px;
  align-items: center;
  text-decoration: none;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
.card:active { transform: scale(.99); }
.card h2 {
  margin: 0 0 3px;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
.card .copy { min-width: 0; }
.ico {
  width: 52px; height: 52px; border-radius: 12px;
  display: grid; place-items: center;
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 800; font-size: 18px;
  color: #111;
}
.sds .ico { background: var(--green); }
.how .ico { background: #7ad0a4; }
.emg .ico { background: var(--red); color: #fff; }
.blt .ico { background: var(--blue); color: #081018; }
.emp .ico { background: var(--amber); }
.trn .ico { background: #c9842a; }
.tag {
  display: inline-block;
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; padding: 4px 7px; border-radius: 999px;
  background: #243040; color: var(--muted); white-space: nowrap;
}
.tag.public { background: rgba(61,186,122,.15); color: var(--green); }
.tag.soon { background: rgba(232,163,23,.12); color: var(--amber); }
button.linklike {
  width: 100%; text-align: left; border: 0; background: transparent;
  padding: 0; font: inherit; color: inherit; cursor: pointer;
}
.panel {
  display: none;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 16px 8px;
  margin: -2px 0 8px;
}
.panel.on { display: block; }
.panel h3 {
  margin: 0 0 8px;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 16px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--amber);
}
.panel ul { margin: 0 0 12px; padding: 0 0 0 18px; }
.panel li { margin: 0 0 7px; font-size: 14px; line-height: 1.4; color: #d5dde6; }
.phone { font-weight: 700; color: #fff; }
.note { font-size: 12px; color: var(--muted); margin: 14px 2px 0; line-height: 1.45; }
footer { text-align: center; font-size: 11px; color: #6b7684; padding: 8px 12px 28px; }
label.sr {
  display: block; font-size: 12px; font-weight: 700; color: var(--amber);
  letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px;
}
input[type=search] {
  width: 100%; font-size: 20px; padding: 16px;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--panel); color: var(--ink);
  font-family: "IBM Plex Sans", sans-serif;
}
input[type=search]:focus { outline: 2px solid var(--amber); border-color: transparent; }
.hint { font-size: 12px; color: var(--muted); margin: 8px 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chips button {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600;
}
.chips button.on { background: var(--amber); color: #16120a; border-color: var(--amber); }
.count { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
a.row {
  display: block; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 16px; margin: 0 0 8px;
  text-decoration: none; color: inherit;
}
a.row.best { border-color: var(--amber); box-shadow: inset 3px 0 0 var(--amber); }
a.row strong { display: block; font-size: 17px; line-height: 1.25; }
a.row em { background: rgba(232,163,23,.28); font-style: normal; border-radius: 3px; padding: 0 2px; }
a.row span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.empty {
  background: var(--panel); border: 1px dashed var(--line);
  padding: 16px; border-radius: 14px; line-height: 1.4; color: var(--muted);
}
.site-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 0 0 16px; }
.site-row button {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font-weight: 700; font-size: 13px; padding: 10px 6px; border-radius: 10px;
}
.site-row button[aria-pressed="true"] { background: var(--amber); color: #16120a; border-color: var(--amber); }

  </style>

<body>

  <script>
(function () {
  const cfg = window.HS_SEARCH || {};
  const folder = cfg.folder || "sds";
  const emptyMsg = cfg.empty || "Nothing in this library yet.";
  const noMatch = cfg.noMatch || "Nothing matches those letters.";
  const aliases = cfg.aliases || {};

  let items = [], group = "All";
  const list = document.getElementById("list");
  const q = document.getElementById("q");
  const chips = document.getElementById("chips");
  const count = document.getElementById("count");

  function norm(s) {
    return (s || "").toLowerCase().replace(/[_./+\-]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function haystack(it) {
    if (it._hay) return it._hay;
    const base = norm(it.name + " " + it.group + " " + it.file);
    const extra = [];
    Object.keys(aliases).forEach(function (key) {
      if (base.indexOf(key) !== -1) extra.push(aliases[key].join(" "));
    });
    it._hay = (base + " " + extra.join(" ")).trim();
    it._words = it._hay.split(" ");
    return it._hay;
  }
  function score(it, raw) {
    const term = norm(raw);
    if (!term) return 1;
    const hay = haystack(it);
    const words = term.split(" ");
    let s = 0;
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (!w) continue;
      if (hay.indexOf(w) === -1) return 0;
      if (norm(it.name).indexOf(w) === 0) s += 50;
      else if (it._words.some(function (x) { return x.indexOf(w) === 0; })) s += 20;
      else s += 8;
    }
    if (norm(it.name).indexOf(term) === 0) s += 30;
    return s;
  }
  function highlight(text, raw) {
    const safe = String(text || "").replace(/[&<>]/g, "");
    const term = norm(raw);
    if (!term) return safe;
    let out = safe;
    term.split(" ").filter(Boolean).forEach(function (w) {
      const re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      out = out.replace(re, "<em>$1</em>");
    });
    return out;
  }
  function render() {
    if (!items.length) {
      count.textContent = "";
      list.innerHTML = "<div class='empty'>" + emptyMsg + "</div>";
      return;
    }
    const term = q.value || "";
    const ranked = items.map(function (it) {
      if (group !== "All" && it.group !== group) return null;
      const sc = score(it, term);
      return sc ? { it: it, sc: sc } : null;
    }).filter(Boolean).sort(function (a, b) {
      return b.sc - a.sc || a.it.name.localeCompare(b.it.name);
    });
    const typing = norm(term).length > 0;
    const shown = typing ? ranked.slice(0, 8) : ranked;
    count.textContent = typing
      ? (shown.length ? "Top matches — tap one" : "No match")
      : shown.length + " files — type to narrow";
    if (!shown.length) {
      list.innerHTML = "<div class='empty'>" + noMatch + "</div>";
      return;
    }
    list.innerHTML = shown.map(function (row, i) {
      const it = row.it;
      const cls = typing && i === 0 ? "row best" : "row";
      var file = String(it.file || "").split("/").pop();
      var href = "viewer.html?f=" + encodeURIComponent(file);
      return "<a class=\"" + cls + "\" href=\"" + href + "\">" +
        "<strong>" + highlight(it.name, term) + "</strong>" +
        "<span>" + it.group + (typing && i === 0 ? " · best match" : "") + "</span></a>";
    }).join("");
  }
  function load(data) {
    items = Array.isArray(data) ? data : [];
    items.forEach(haystack);
    const names = Array.from(new Set(items.map(function (i) { return i.group; }))).sort();
    const groups = names.length ? ["All"].concat(names) : [];
    chips.innerHTML = groups.map(function (g, i) {
      return "<button type='button' data-g='" + g + "' class='" + (i === 0 ? "on" : "") + "'>" + g + "</button>";
    }).join("");
    chips.onclick = function (e) {
      const btn = e.target.closest("button");
      if (!btn) return;
      group = btn.getAttribute("data-g");
      chips.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b === btn); });
      render();
    };
    render();
  }
  if (window.HS_CATALOG) {
    load(window.HS_CATALOG);
  } else {
    fetch("/" + folder + "/catalog.json").then(function (r) { return r.json(); }).then(load).catch(function () {
      items = [];
      render();
    });
  }
  q.addEventListener("input", render);
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      const first = list.querySelector("a.row");
      if (first) { e.preventDefault(); first.click(); }
    }
  });
  q.focus();
})();

  </script>
