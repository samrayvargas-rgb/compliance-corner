<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10151c" />
  <title>Spill · Emergency</title>
  <link rel="stylesheet" href="corner.css" />
  <style>
    .call { display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 10px; text-decoration:none; color:inherit; }
    .call .who { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .call .num { font-family:"Barlow Condensed",sans-serif; font-size:28px; font-weight:800; color:#fff; }
  </style>
</head>
<body>
  <header class="sub">
    <div class="brand"><img src="logo-header.png" alt="HubStarr Logistics" /></div>
    <a href="emergency.html">← Emergency</a>
    <h1>Spill</h1>
  </header>
  <div class="wrap">
    <div class="card" style="display:block">
      <h2>Small / incidental</h2>
      <p>Use the 41-gallon mobile kit. Open FastField Chemical Spill Response. Then tell the supervisor.</p>
    </div>
    <div class="card" style="display:block;margin-top:10px">
      <h2>Large / someone hurt</h2>
      <p>Back out. Call 911 if needed. Then Ruben. EAP / AZ-099.</p>
    </div>
    <a class="call" href="tel:911" style="margin-top:12px"><div class="who">If people are in danger</div><div class="num">911</div></a>
    <a class="call" href="tel:6235234613"><div class="who">EAP — Ruben</div><div class="num">623-523-4613</div></a>
  </div>
</body>
</html>
