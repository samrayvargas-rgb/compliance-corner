<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10151c" />
  <title>SDS · HubStarr</title>
  <style>
    html, body { margin:0; height:100%; background:#10151c; }
    header {
      display:flex; align-items:center; gap:12px;
      padding:10px 12px; background:#151c28; border-bottom:1px solid #2c3644;
    }
    header a { color:#e82020; font:600 14px/1 Arial,sans-serif; text-decoration:none; }
    header span { color:#e8edf3; font:600 14px/1.2 Arial,sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    iframe, embed { width:100%; height:calc(100% - 44px); border:0; background:#fff; }
  </style>
</head>
<body>
  <header>
    <a href="library.html">← SDS</a>
    <span id="name">Opening sheet…</span>
  </header>
  <iframe id="frame" title="SDS"></iframe>
  <script>
    var raw = new URLSearchParams(location.search).get("f") || "";
    var file = raw.split("\\").pop().split("/").pop();
    if (!file || !/\.pdf$/i.test(file) || file !== raw) {
      document.getElementById("name").textContent = "Missing sheet";
    } else {
      document.getElementById("name").textContent = file.replace(/_/g, " ").replace(/\.pdf$/i, "");
      document.getElementById("frame").src = "/" + encodeURIComponent(file);
    }
  </script>
</body>
</html>
